<style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ============================ Utils ============================ */
const TOMADOR_CNPJ = "27063726"; // A Gazeta (destinatário) — sempre ignorado como emitente
const LIMITE_PADRAO = 10000;

function onlyDigits(s){ return (s||"").replace(/\D/g,""); }

function normName(s){
  return (s||"").toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
}

function fmtBRL(n){
  if(n===null||n===undefined||isNaN(n)) return "—";
  return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function fmtCNPJ(d){
  d = onlyDigits(d);
  if(d.length===14) return d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,"$1.$2.$3/$4-$5");
  if(d.length===11) return d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,"$1.$2.$3-$4");
  return d;
}

// Converte string de valor BR/US p/ número, decidindo o decimal pelo último separador
function toNumber(s){
  if(!s) return null;
  s = s.trim();
  const lastComma = s.lastIndexOf(","), lastDot = s.lastIndexOf(".");
  if(lastComma > lastDot){ s = s.replace(/\./g,"").replace(",","."); }
  else { s = s.replace(/,/g,""); }
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

/* ------- Nome do arquivo: DATA - COD - NOME - Nº NOTA ------- */
function parseFilename(fname){
  let base = fname.replace(/\.pdf$/i,"").replace(/_/g," ");
  let data = "";
  const md = base.match(/^\s*(\d{2})[-/ ](\d{2})[-/ ](\d{4})/);
  if(md){ data = md[1]+"/"+md[2]+"/"+md[3]; base = base.slice(md[0].length); }
  const parts = base.split(/\s*-\s*/).map(p=>p.trim()).filter(Boolean);
  let cod="", nome="", num="";
  if(parts.length>=1) cod = onlyDigits(parts[0]);
  if(parts.length>=2) num = onlyDigits(parts[parts.length-1]);
  if(parts.length>=3) nome = parts.slice(1,-1).join(" ").trim();
  else if(parts.length===2) nome = parts[1];
  return { data, codFornecedor:cod, nomeFornecedor:nome, numeroNota:num };
}

/* ------- Texto do PDF via pdf.js ------- */
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

async function extractText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let out = [];
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    out.push(tc.items.map(it=>it.str).join(" "));
  }
  return out.join("\n");
}

/* ------- Tipo de documento ------- */
function detectTipo(t){
  const u = t.toUpperCase();
  if(/NFS-?E|DANFSE|PRESTADOR DE SERVI|NOTA FISCAL.*SERVI/.test(u)) return "NFS-e";
  if(/DANFE|NOTA FISCAL ELETR/.test(u)) return "NF-e";
  // boleto: sinais fortes (ficha de compensação, nosso número, linha digitável, cedente/beneficiário)
  if(/FICHA DE COMPENSA[ÇC][ÃA]O|NOSSO N[ÚU]MERO|LINHA DIGIT[ÁA]VEL|C[ÓO]DIGO DE BARRAS|CEDENTE|BENEFICI[ÁA]RIO|LOCAL DE PAGAMENTO/.test(u)
     || /\d{5}\.\d{5}\s+\d{5}\.\d{6}\s+\d{5}\.\d{6}\s+\d\s+\d{14}/.test(t)) return "Boleto";
  if(/\bRECIBO\b/.test(u)) return "Recibo";
  return "Documento";
}

/* ------- Data de emissão (fallback quando o nome do arquivo não tem data) ------- */
function parseData(t){
  const labels = [
    /Data(?: e Hora)? da emiss[ãa]o da NFS-?e\s*(\d{2}\/\d{2}\/\d{4})/i,
    /Data de Gera[çc][ãa]o da NFS-?e\s*(\d{2}\/\d{2}\/\d{4})/i,
    /DATA DA EMISS[ÃA]O\s*(\d{2}\/\d{2}\/\d{4})/i,
    /DATA DE EMISS[ÃA]O\s*(\d{2}\/\d{2}\/\d{4})/i,
    /Data Fato Gerador\s*(\d{2}\/\d{2}\/\d{4})/i,
    /Emitido em\s*(\d{2}\/\d{2}\/\d{4})/i
  ];
  for(const re of labels){ const m=t.match(re); if(m) return m[1]; }
  const g = t.match(/\b(\d{2}\/\d{2}\/\d{4})\b/); return g ? g[1] : "";
}

/* ------- Vencimento (do carimbo / anotação / nome do arquivo) ------- */
function parseVencimento(t, fname){
  const D="(\\d{2}[./]\\d{2}[./]\\d{4})";
  const pats=[
    new RegExp("VENCI(?:MENTO|-|\\.)?\\s*:?\\s*"+D,"i"),   // carimbo "VENCI- 05.05.2026"
    new RegExp("Data de Vencimento\\s*:?\\s*"+D,"i"),
    new RegExp("\\bVENC\\.?\\s*:?\\s*"+D,"i"),
    new RegExp("\\bV\\s*:\\s*"+D,"i")                       // anotação vermelha "V: 05.08.2026"
  ];
  for(const re of pats){ const m=t.match(re); if(m) return m[1].replace(/\./g,"/"); }
  const mf=(fname||"").match(/^(\d{2})[-_.](\d{2})[-_.](\d{4})/);  // data no início do arquivo = vencimento
  if(mf) return mf[1]+"/"+mf[2]+"/"+mf[3];
  return "";
}
function parseDateBR(s){ const m=(s||"").match(/(\d{2})[./](\d{2})[./](\d{4})/); return m?new Date(+m[3], +m[2]-1, +m[1]):null; }
function diasPrazo(emissao, vencimento){
  const a=parseDateBR(emissao), b=parseDateBR(vencimento);
  if(!a||!b) return null;
  return Math.round((b-a)/86400000);
}
/* Política de pagamento Rede Gazeta: ideal >= 45, mínimo >= 30 */
function politica(dias){
  if(dias===null||dias===undefined) return {code:"nd", label:"—", tone:"low"};
  if(dias>=45) return {code:"ideal", label:dias+"d · ideal", tone:"ok"};
  if(dias>=30) return {code:"min", label:dias+"d · mínimo", tone:"warn"};
  return {code:"fora", label:dias+"d · fora", tone:"miss"};
}

/* ------- CNPJ do prestador/emitente ------- */
function parseCNPJ(t){
  // 1) chave NFS-e nacional (50 díg): CNPJ do prestador em posição fixa (9..22)
  let ch = t.match(/\d{50}/);
  if(ch){ const c = ch[0].slice(9,23); if(/^\d{14}$/.test(c)) return c; }
  // 2) chave NF-e/NFC-e (44 díg, agrupada ou contígua): CNPJ do emitente nas posições 7..20
  ch = t.match(/(?:\d{4}[ .\-]?){10}\d{4}/) || t.match(/\d{44}/);
  if(ch){ const d = onlyDigits(ch[0]); if(d.length>=20) return d.slice(6,20); }
  // 3) CNPJ impresso do prestador: antes do marcador TOMADOR
  const ti = (t.search(/TOMADOR/i)+1) || t.length;
  const fmt = /\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/g; let m;
  while((m=fmt.exec(t))){ if(m.index < ti) return onlyDigits(m[0]); }
  // 4) qualquer CNPJ formatado, senão 14 dígitos isolados
  m = t.match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/); if(m) return onlyDigits(m[0]);
  const b = t.match(/(?<!\d)\d{14}(?!\d)/); return b ? b[0] : "";
}

/* ------- Valor total (produto = valor da nota; serviço = valor do serviço) ------- */
function parseValor(t){
  const N = "([\\d]{1,3}(?:[.\\s]\\d{3})*[.,]\\d{2}|\\d+[.,]\\d{2})";
  const tryPat = (pat)=>{ const m=t.match(new RegExp(pat,"i")); return m?toNumber(m[1]):null; };
  const labels = [
    "VALOR TOTAL[:\\s]+R?\\$?\\s*"+N,                 // cabeçalho DANFE
    "VALOR SERVI[ÇC]O[^\\d]{0,40}?"+N,                // NFS-e prefeitura
    "VALOR DOS SERVI[ÇC]OS?[^\\d]{0,20}?"+N,          // NFS-e eNotas
    "Vl\\.? do Servi[çc]o[^\\d]{0,20}?"+N,            // NFS-e Governo DF
    "Valor do Servi[çc]o[^\\d]{0,25}?"+N,             // DANFSe nacional
    "VALOR TOTAL DA NOTA(?!\\s*FISCAL)[^\\d]{0,40}?"+N, // DANFE (backup)
    "VALOR TOTAL DO SERVI\\w+[^\\d]{0,40}?"+N,
    "VALOR DO DOCUMENTO[^\\d]{0,20}?"+N               // boleto
  ];
  for(const lb of labels){ const v=tryPat(lb); if(v!==null) return v; }
  // recibo / doc simples: "VALOR 7.401,81", "R$ 7.401,81" ou "7.401,81 R$" — maior valor monetário
  const money=[]; let m;
  const reMoney = new RegExp("R\\$\\s*"+N+"|"+N+"\\s*R\\$","gi");
  while((m=reMoney.exec(t))){ const n=toNumber(m[1]||m[2]); if(n!==null) money.push(n); }
  if(money.length) return Math.max.apply(null, money);
  const v=tryPat("VALOR[^\\d]{0,15}?"+N); if(v!==null) return v;
  return null;
}

/* ------- Razões sociais na ordem do documento (prestador vem primeiro) ------- */
function limpaNome(s){
  // corta no primeiro rótulo de outro campo que tenha grudado na mesma linha
  s = s.split(/\s+(?:E-?mai?l|Endere[çc]o|Fone|Celular|Site|CPF\s*\/\s*CNPJ|CNPJ|CPF|Inscri[çc][ãa]o|Nome Fantasia|Munic[íi]pio|CEP|Regime|Simples Nacional|Telefone|Tel\.?)\b/i)[0];
  return s.replace(/\s+/g," ").trim().slice(0,60);
}
function nomesDocumento(t){
  const re = /(?:Nome\s*\/\s*Raz[ãa]o Social|Raz[ãa]o Social|NOME\s*\/\s*RAZ[ÃA]O SOCIAL|Nome\s*\/\s*Nome Empresarial)[:\s]*([A-Z0-9][^\n]{2,90})/gi;
  const out=[]; let m;
  while((m=re.exec(t))){
    const n=limpaNome(m[1]);
    if(n.length>=2 && !/^(Inscri|CNPJ|CPF|E-?mai?l|Endere|Munic|Tel)/i.test(n)) out.push(n);
  }
  return out;
}

/* ------- Fornecedor a partir do nome do arquivo (2 convenções) ------- */
function fornecedorDoArquivo(fname){
  let b = fname.replace(/\.pdf$/i,"").replace(/_/g," ");
  const md = b.match(/^\s*\d{2}[-/ ]\d{2}[-/ ]\d{4}/); if(md) b = b.slice(md[0].length);
  const parts = b.split(/\s*-\s*/).map(x=>x.trim()).filter(Boolean);
  if(!parts.length) return "";
  const firstNum = /^[\d ]+$/.test(parts[0]);
  if(firstNum && parts.length>=3) return parts.slice(1,-1).join(" ").trim();  // produto: DATA-COD-NOME-Nº
  const tk = parts[0].replace(/\bNF\b.*/i,"").trim();                          // serviço: FORNECEDOR-...-NF Nº
  return /^[\d ]+$/.test(tk) ? "" : tk;
}

/* ------- Empresa tomadora (uma das 11 do grupo) ------- */
const MAP_EMPRESA = {
  SA:"S.A. A Gazeta", SAA:"S.A. A Gazeta", CIDADA:"Rádio Cidadã", "CIDADÃ":"Rádio Cidadã",
  DIFUS:"Difusora", DIFUSORA:"Difusora", VIDEO:"Vídeo Express", "VÍDEO":"Vídeo Express",
  TVN:"Sistema Norte (TVN)", FM102:"Rádio FM 102", "FM 102":"Rádio FM 102"
};
function empresaTomadora(nomes, tipo, isENotas, fname){
  // 1) do conteúdo: prestador é o 1º nome; tomador é o 2º (ou o único, em eNotas)
  let t = tipo==="NFS-e" ? (isENotas ? (nomes[0]||"") : (nomes[1]||"")) : (nomes[0]||"");
  if(t) return t;
  // 2) fallback: sigla no token do meio do nome do arquivo (ex.: "MILE - VIDEO 8577 - NF 887")
  const b = fname.replace(/\.pdf$/i,"").replace(/_/g," ");
  const parts = b.split(/\s*-\s*/).map(x=>x.trim()).filter(Boolean);
  if(parts.length>=3){
    const sig = parts[1].replace(/\d+/g,"").trim().toUpperCase();
    if(sig) return MAP_EMPRESA[sig] || sig;
  }
  return "";
}

/* ------- Descrição ------- */
function parseDescricao(t, tipo){
  let m;
  if(tipo==="NFS-e"){
    m = t.match(/Descri[çc][ãa]o do Servi[çc]o\s*([^\n]{3,140})/i); if(m && !/^\s*-/.test(m[1])) return m[1].trim();
    m = t.match(/DISCRIMINA[ÇC][ÃA]O D[OE]S? SERVI[ÇC]OS?\s+([^\n]{3,140})/i); if(m) return m[1].trim();
    m = t.match(/\b(1[0-9]\.\d{2}(?:\.\d{2})?\s*[-–]\s*[^\n]{4,90})/); if(m) return m[1].trim();
  }
  m = t.match(/DESCRI[ÇC][ÃA]O DO PRODUTO[^\n]*\n?\s*([A-Za-zÀ-ú][^\n]{4,120})/i); if(m) return m[1].trim();
  m = t.match(/RECEBEMOS DE\s+(.{4,80}?)\s+OS PRODUTOS/i); if(m) return "Fornec.: "+m[1].trim();
  return "";
}

async function parseNota(file){
  const meta = parseFilename(file.name);
  let text = "";
  try{ text = await extractText(file); }catch(e){ text=""; }
  const clean = (text||"").replace(/[ \t]+/g," ");
  const tipo = detectTipo(clean);
  const valor = parseValor(clean);
  const cnpj = parseCNPJ(clean);
  const desc = parseDescricao(clean, tipo);
  const nomes = nomesDocumento(clean);
  const isENotas = /eNotas/i.test(clean);
  const fnForn = fornecedorDoArquivo(file.name);
  // NFS-e (menos eNotas): razão social do prestador (conteúdo) é a fonte boa; senão nome do arquivo
  let nome;
  if(tipo==="NFS-e" && !isENotas) nome = nomes[0] || fnForn || (cnpj?fmtCNPJ(cnpj):"");
  else nome = fnForn || nomes[0] || (cnpj?fmtCNPJ(cnpj):"");
  const legivel = clean.trim().length > 200 && valor!==null;
  const emissao = parseData(clean);
  const vencimento = parseVencimento(clean, file.name);
  return {
    id: file.name+"|"+file.size,
    arquivo:file.name,
    _file: file,
    ...meta,
    data: emissao,
    vencimento,
    prazoDias: diasPrazo(emissao, vencimento),
    nomeFornecedor: nome || meta.nomeFornecedor,
    tomador: empresaTomadora(nomes, tipo, isENotas, file.name),
    tipo, cnpj, valor,
    valorManual:false,
    descricao:desc,
    legivel,
  };
}

async function detectContrato(file){
  // usado p/ contratos anexados na leva: identifica fornecedor pelo nome do arquivo + CNPJ do texto
  const meta = parseFilename(file.name);
  let text=""; try{ text=await extractText(file); }catch(e){}
  const cnpj = parseCNPJ((text||"").replace(/[ \t]+/g," "));
  return { arquivo:file.name, cnpj, nome:meta.nomeFornecedor, cod:meta.codFornecedor, blob:file };
}

/* ============================ IndexedDB ============================ */
const DB_NAME="gazeta-contratos", STORE="contratos", CFG="config";
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME,2);
    r.onupgradeneeded = ()=>{
      const db=r.result;
      if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:"cnpj"});
      if(!db.objectStoreNames.contains(CFG)) db.createObjectStore(CFG,{keyPath:"key"});
    };
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
async function dbAll(){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const rq=db.transaction(STORE).objectStore(STORE).getAll();
    rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>rej(rq.error);
  });
}
async function dbPut(rec){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const rq=db.transaction(STORE,"readwrite").objectStore(STORE).put(rec);
    rq.onsuccess=()=>res(true); rq.onerror=()=>rej(rq.error);
  });
}
async function dbDel(cnpj){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const rq=db.transaction(STORE,"readwrite").objectStore(STORE).delete(cnpj);
    rq.onsuccess=()=>res(true); rq.onerror=()=>rej(rq.error);
  });
}
async function dbGetCfg(key){
  const db=await openDB();
  return new Promise((res)=>{
    const rq=db.transaction(CFG).objectStore(CFG).get(key);
    rq.onsuccess=()=>res(rq.result?rq.result.value:null); rq.onerror=()=>res(null);
  });
}
async function dbPutCfg(key,value){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const rq=db.transaction(CFG,"readwrite").objectStore(CFG).put({key,value});
    rq.onsuccess=()=>res(true); rq.onerror=()=>rej(rq.error);
  });
}

/* ============================ OCR (Gemini via proxy) ============================ */
const OCR_PROMPT =
"Você recebe um documento fiscal brasileiro (NF-e de produto, NFS-e de serviço, recibo ou boleto bancário) em PDF. "+
"Extraia os dados do EMITENTE/PRESTADOR (quem EMITIU o documento), nunca do tomador/sacado. "+
"Responda SOMENTE com um objeto JSON, sem texto extra nem markdown, com as chaves: "+
'{"fornecedor": razão social do emitente/prestador, "cnpj": só os dígitos do CNPJ do emitente, '+
'"valor": valor total do serviço/nota/documento como número com ponto decimal, "numero": número da nota/documento, '+
'"data": data de emissão no formato dd/mm/aaaa, '+
'"vencimento": data de vencimento no formato dd/mm/aaaa (procure um carimbo/quadro com o campo VENCIMENTO ou VENCI-), '+
'"descricao": discriminação/descrição resumida em até 140 caracteres, '+
'"empresa": razão social do TOMADOR/destinatário/sacado, '+
'"tipo": um de "NF-e", "NFS-e", "Recibo" ou "Boleto"}. Se um campo não existir, use null.';

function fileToB64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(String(r.result).split(",")[1]);
    r.onerror=()=>rej(r.error);
    r.readAsDataURL(file);
  });
}
async function ocrNota(file, url){
  const b64 = await fileToB64(file);
  const body = {
    contents:[{role:"user", parts:[
      {inlineData:{mimeType:"application/pdf", data:b64}},
      {text: OCR_PROMPT}
    ]}],
    generationConfig:{ temperature:0, responseMimeType:"application/json" }
  };
  const resp = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if(resp.status===429) throw new Error("429");
  if(!resp.ok) throw new Error("HTTP "+resp.status);
  const data = await resp.json();
  const txt = ((data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [])
    .map(p=>p.text||"").join("").replace(/```json|```/g,"").trim();
  return JSON.parse(txt);
}

function Painel({notas}){

    <div className="card"><div className="empty"><div className="em">📊</div>
      <p>Envie uma leva na aba <b>Conferência</b> para ver o painel.</p></div></div>);

  const comPrazo = notas.filter(n=>n.prazoDias!=null);
  const nd = notas.length - comPrazo.length;
  const seg = {ideal:0, min:0, fora:0};
  comPrazo.forEach(n=>{ const c=politica(n.prazoDias).code; if(seg[c]!=null) seg[c]++; });
  const totalP = comPrazo.length || 1;
  const pctFora = Math.round(seg.fora/totalP*100);
  const pctDentro = Math.round((seg.ideal+seg.min)/totalP*100);
  const prazoMedio = comPrazo.length ? Math.round(comPrazo.reduce((s,n)=>s+n.prazoDias,0)/comPrazo.length) : null;
  const foraNotas = comPrazo.filter(n=>politica(n.prazoDias).code==="fora");
  const valorFora = foraNotas.reduce((s,n)=>s+(n.valor||0),0);

  // agrupamento das notas fora da política por empresa/setor
  const emp={}; foraNotas.forEach(n=>{ const k=n.tomador||"(sem empresa)"; (emp[k]=emp[k]||{n:0,v:0}); emp[k].n++; emp[k].v+=n.valor||0; });
  const empArr = Object.entries(emp).map(([empresa,x])=>({empresa,...x})).sort((a,b)=>b.n-a.n);
  const topEmp = empArr[0];
  const maxN = Math.max(1, ...empArr.map(e=>e.n));

  const segments=[
    {label:"Ideal (≥45d)", value:seg.ideal, color:"#1f7a4d"},
    {label:"Mínimo (30–44d)", value:seg.min, color:"#c9a227"},
    {label:"Fora (<30d)", value:seg.fora, color:"#b3261e"},
  ];
  const R=54, C=2*Math.PI*R, tot=segments.reduce((s,x)=>s+x.value,0)||1; let acc=0;

  return (
    <div>
      <div className="summary">
        <div className="stat"><div className="k">Notas com prazo</div><div className="v">{comPrazo.length}{nd>0 && <span style={{fontSize:12,color:"var(--muted)",fontWeight:400}}> +{nd} s/ data</span>}</div></div>
        <div className="stat"><div className="k">Dentro da política</div><div className="v" style={{color:"var(--ok)"}}>{pctDentro}%</div></div>
        <div className="stat alert"><div className="k">Fora da política</div><div className="v" style={{color:"var(--danger)"}}>{pctFora}%</div></div>
        <div className="stat"><div className="k">Prazo médio</div><div className="v">{prazoMedio!=null?prazoMedio+"d":"—"}</div></div>
        <div className="stat alert"><div className="k">Valor fora</div><div className="v" style={{fontSize:18}}>{fmtBRL(valorFora)}</div></div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"320px 1fr",gap:18,alignItems:"start"}} className="painel-grid">
        <div className="card">
          <h2>Distribuição por prazo</h2>
          <div style={{display:"flex",alignItems:"center",gap:16}}>
            <svg viewBox="0 0 140 140" style={{width:150,height:150,flex:"none"}}>
              <circle cx="70" cy="70" r={R} fill="none" stroke="#eef1f7" strokeWidth="18"/>
              {segments.map((s,i)=>{ const dash=s.value/tot*C; const el=(
                <circle key={i} cx="70" cy="70" r={R} fill="none" stroke={s.color} strokeWidth="18"
                  strokeDasharray={dash+" "+(C-dash)} strokeDashoffset={-acc} transform="rotate(-90 70 70)"/>
              ); acc+=dash; return el; })}
              <text x="70" y="66" textAnchor="middle" fontSize="24" fontWeight="800" fill="#0f2242">{pctFora}%</text>
              <text x="70" y="86" textAnchor="middle" fontSize="10" fill="#6b7896">fora</text>
            </svg>
            <div>
              {segments.map((s,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,fontSize:13}}>
                  <span style={{width:12,height:12,borderRadius:3,background:s.color,flex:"none"}}></span>
                  <span style={{flex:1}}>{s.label}</span>
                  <b style={{fontVariantNumeric:"tabular-nums"}}>{s.value}</b>
                </div>
              ))}
              {nd>0 && <div style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"var(--muted)"}}>
                <span style={{width:12,height:12,borderRadius:3,background:"#b8c1d4",flex:"none"}}></span>
                <span style={{flex:1}}>Sem data</span><b>{nd}</b></div>}
            </div>
          </div>
        </div>

        <div className="card">
          <h2>Fora da política por empresa/setor</h2>
          {empArr.length===0
            ? <p className="footnote" style={{marginTop:0}}>Nenhuma nota fora da política nesta leva. 👏</p>
            : empArr.slice(0,8).map((e,i)=>(
              <div key={i} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:3}}>
                  <span className="forn" style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"70%"}}>{e.empresa}</span>
                  <span style={{fontVariantNumeric:"tabular-nums",color:"var(--muted)"}}>{e.n} nota(s) · {fmtBRL(e.v)}</span>
                </div>
                <div style={{height:10,background:"#f0f3f9",borderRadius:6,overflow:"hidden"}}>
                  <div style={{width:(e.n/maxN*100)+"%",height:"100%",background:"#b3261e"}}></div>
                </div>
              </div>
            ))}
        </div>
      </div>

      <div className="card" style={seg.fora>0?{borderColor:"var(--gold)",background:"#fffdf3"}:null}>
        <h2>{seg.fora>0?"💡 Recomendação":"✅ Situação"}</h2>
        {seg.fora>0
          ? <p style={{margin:0,fontSize:14,lineHeight:1.55}}>
              <b>{pctFora}%</b> das notas com prazo estão <b style={{color:"var(--danger)"}}>fora da política</b> (menos de 30 dias entre emissão e vencimento){valorFora>0 && <> — somando <b>{fmtBRL(valorFora)}</b></>}.
              {topEmp && <> O setor com mais casos é <b>{topEmp.empresa}</b> ({topEmp.n} nota(s)). </>}
              Sugerimos <b>conversar com {topEmp?"esse setor":"os setores envolvidos"}</b> para renegociar os prazos de pagamento com os fornecedores e melhorar as condições de compra — o ideal é fechar em <b>45 dias</b>.
            </p>
          : <p style={{margin:0,fontSize:14}}>Todas as {comPrazo.length} notas com prazo estão dentro da política (mínimo 30 dias). Continue assim!</p>}
      </div>
    </div>
  );
}

/* ============================ App ============================ */
function App(){
  const [tab,setTab] = useState("conf");
  const [registry,setRegistry] = useState([]);   // cadastro salvo (IndexedDB)
  const [notas,setNotas] = useState([]);          // notas da leva atual
  const [lote,setLote] = useState([]);            // contratos anexados na leva
  const [limite,setLimite] = useState(LIMITE_PADRAO);
  const [filtro,setFiltro] = useState("todas");
  const [busy,setBusy] = useState(false);
  const [toast,setToast] = useState("");
  const [emailCfg,setEmailCfg] = useState(EMAIL_PADRAO);
  const [usuarios,setUsuarios] = useState([]);   // usuários internos (nome + e-mail)
  const [picker,setPicker] = useState(null);      // nota em devolução (abre o seletor)
  const [ocrCfg,setOcrCfg] = useState({url:""});  // proxy Gemini
  const [ocrRun,setOcrRun] = useState(null);      // progresso {done,total}
  const [readProg,setReadProg] = useState(null);  // progresso da leitura {done,total}

  const reload = useCallback(async()=>{ setRegistry(await dbAll()); },[]);
  useEffect(()=>{ reload(); (async()=>{
    const c=await dbGetCfg("email"); if(c) setEmailCfg({...EMAIL_PADRAO, ...c});
    const u=await dbGetCfg("usuarios"); if(Array.isArray(u)) setUsuarios(u);
    const o=await dbGetCfg("ocr"); if(o) setOcrCfg({url:"", ...o});
  })(); },[reload]);

  function flash(msg){ setToast(msg); setTimeout(()=>setToast(""),2600); }

  async function saveEmailCfg(cfg){ await dbPutCfg("email", cfg); setEmailCfg(cfg); flash("Texto de devolução salvo"); }
  async function saveUsuarios(arr){ await dbPutCfg("usuarios", arr); setUsuarios(arr); }
  async function saveOcrCfg(cfg){ await dbPutCfg("ocr", cfg); setOcrCfg(cfg); flash("OCR configurado"); }

  function applyOcr(id, j){
    setNotas(prev=>prev.map(x=>{
      if(x.id!==id) return x;
      const valor = (j.valor!=null && !isNaN(Number(j.valor))) ? Number(j.valor) : x.valor;
      const data = j.data || x.data;
      const vencimento = j.vencimento || x.vencimento;
      return {
        ...x,
        nomeFornecedor: j.fornecedor || x.nomeFornecedor,
        cnpj: j.cnpj ? onlyDigits(j.cnpj) : x.cnpj,
        valor,
        numeroNota: j.numero || x.numeroNota,
        data,
        vencimento,
        prazoDias: diasPrazo(data, vencimento),
        tipo: j.tipo || x.tipo,
        descricao: j.descricao || x.descricao,
        tomador: j.empresa || x.tomador,
        _ocr:true, valorManual:false,
        legivel: valor!==null,
      };
    }));
  }
  async function runOcr(list){
    if(!ocrCfg.url){ flash("Configure a URL do proxy Gemini na aba Cadastro"); return; }
    const alvos = list.filter(n=>n._file);
    if(!alvos.length){ flash("Nada para reprocessar (arquivos não estão mais em memória — reenvie a leva)"); return; }
    setOcrRun({done:0,total:alvos.length});
    let done=0;
    for(const n of alvos){
      try{ const j = await ocrNota(n._file, ocrCfg.url); applyOcr(n.id, j); }
      catch(e){
        if(String(e.message).includes("429")){ flash("Limite do Gemini (429) — pausei. Tente de novo em instantes."); break; }
        flash("Falha no OCR de "+(n.nomeFornecedor||n.arquivo)+": "+e.message);
      }
      done++; setOcrRun({done, total:alvos.length});
      await new Promise(r=>setTimeout(r, 700)); // respeita o RPM do Gemini
    }
    setOcrRun(null); flash("OCR concluído em "+done+" nota(s)");
  }

  // abre o seletor de usuário; o envio de fato é no enviarDevolucao
  function devolver(n){ setPicker(n); }

  function enviarDevolucao(n, email, nomeUsuario){
    if(!email){ flash("Informe um e-mail"); return; }
    const assunto = aplicarTemplate(emailCfg.assunto, n, emailCfg.remetente);
    const corpo = aplicarTemplate(emailCfg.corpo, n, emailCfg.remetente);
    if(n._file){
      const a=document.createElement("a"); a.href=URL.createObjectURL(n._file); a.download=n.arquivo||"nota.pdf"; a.click();
    }
    window.location.href = "mailto:"+encodeURIComponent(email)+"?subject="+encodeURIComponent(assunto)+"&body="+encodeURIComponent(corpo);
    setPicker(null);
    flash("Devolução aberta para "+(nomeUsuario||email)+(n._file?" — anexe a NF baixada":""));
  }

  // índices por CNPJ (forte) e por razão social normalizada; exceção é separada do contrato
  const regByCnpj = {}, regByName = {}, excByCnpj = {}, excByName = {};
  registry.forEach(r=>{
    const dc=onlyDigits(r.cnpj), nn=normName(r.razaoSocial);
    if(r.excecao){ if(dc) excByCnpj[dc]=r; if(nn) excByName[nn]=r; }
    else { if(dc) regByCnpj[dc]=r; if(nn) regByName[nn]=r; }
  });
  const loteByCnpj = {}, loteByName = {};
  lote.forEach(c=>{ if(c.cnpj) loteByCnpj[onlyDigits(c.cnpj)]=c; if(c.nome) loteByName[normName(c.nome)]=c; });

  function statusNota(n){
    const v = n.valor;
    if(v===null || isNaN(v)) return {code:"ileg", label:"Ilegível", tone:"warn"};
    if(v <= limite) return {code:"low", label:"Abaixo do limite", tone:"low"};
    const cnpj = onlyDigits(n.cnpj);
    const nm = normName(n.nomeFornecedor);
    if((cnpj && excByCnpj[cnpj]) || (nm && excByName[nm])) return {code:"exc", label:"Exceção", tone:"exc"};
    if((cnpj && (regByCnpj[cnpj]||loteByCnpj[cnpj])) || (nm && (regByName[nm]||loteByName[nm]))) return {code:"ok", label:"Contrato OK", tone:"ok"};
    return {code:"miss", label:"FALTA CONTRATO", tone:"miss"};
  }

  const enriched = notas.map(n=>({ ...n, _st:statusNota(n) }));
  const missing = enriched.filter(n=>n._st.code==="miss");
  const excecoes = enriched.filter(n=>n._st.code==="exc");
  const foraPol = enriched.filter(n=>politica(n.prazoDias).code==="fora");
  const somaMiss = missing.reduce((s,n)=>s+(n.valor||0),0);
  const shown = filtro==="miss" ? missing : (filtro==="exc" ? excecoes : (filtro==="fora" ? foraPol : enriched));

  async function onNotas(files){
    setBusy(true);
    const arr = []; const total = files.length;
    setReadProg({done:0, total});
    let i=0;
    for(const f of files){ arr.push(await parseNota(f)); i++; if(i%2===0||i===total) setReadProg({done:i, total}); }
    setReadProg(null);
    setNotas(prev=>{
      const seen = new Set(prev.map(p=>p.id));
      return [...prev, ...arr.filter(a=>!seen.has(a.id))];
    });
    setBusy(false);
    flash(arr.length+" nota(s) lida(s)");
    // híbrido: OCR automático só nas problemáticas (ilegível ou sem valor)
    if(ocrCfg.url){
      const probs = arr.filter(a=>a._file && (!a.legivel || a.valor==null));
      if(probs.length) runOcr(probs);
    }
  }
  async function onContratos(files){
    setBusy(true);
    const arr=[];
    for(const f of files){ arr.push(await detectContrato(f)); }
    setLote(prev=>[...prev,...arr]);
    setBusy(false);
    flash(arr.length+" contrato(s) anexado(s) à leva");
  }

  function setValorManual(id,v){
    const n = toNumber(v);
    setNotas(prev=>prev.map(x=>x.id===id?{...x,valor:(n===null?x.valor:n),valorManual:true,legivel:true}:x));
  }

  async function salvarNoCadastro(n){
    const contrato = lote.find(c=>onlyDigits(c.cnpj)===onlyDigits(n.cnpj) || normName(c.nome)===normName(n.nomeFornecedor));
    const rec = {
      cnpj: onlyDigits(n.cnpj) || ("SEMCNPJ-"+normName(n.nomeFornecedor)),
      razaoSocial: n.nomeFornecedor || (contrato&&contrato.nome) || "",
      arquivoNome: contrato ? contrato.arquivo : "",
      blob: contrato ? contrato.blob : null,
      vigencia:"", obs:"Salvo a partir da conferência", criadoEm:Date.now()
    };
    await dbPut(rec); await reload();
    flash("Contrato de "+(rec.razaoSocial||rec.cnpj)+" salvo no cadastro");
  }

  async function marcarExcecao(n){
    const key = onlyDigits(n.cnpj) || ("SEMCNPJ-"+normName(n.nomeFornecedor));
    const ex = registry.find(r=>r.cnpj===key) || {};
    const rec = {
      ...ex, cnpj:key,
      razaoSocial: n.nomeFornecedor || ex.razaoSocial || "",
      excecao:true, motivoExcecao: ex.motivoExcecao || "Marcado na conferência",
      arquivoNome: ex.arquivoNome || "", blob: ex.blob || null,
      vigencia: ex.vigencia || "", obs: ex.obs || "", criadoEm: ex.criadoEm || Date.now()
    };
    await dbPut(rec); await reload();
    flash((rec.razaoSocial||rec.cnpj)+" marcado como exceção");
  }

  function exportarCSV(){
    const head = ["Emissao","Vencimento","PrazoDias","Politica","Codigo","Fornecedor","Empresa","CNPJ","Tipo","Numero","Descricao","Valor","Status"];
    const rows = enriched.map(n=>[
      n.data, n.vencimento, (n.prazoDias==null?"":n.prazoDias), politica(n.prazoDias).label.replace(/^\d+d · /,""),
      n.codFornecedor, n.nomeFornecedor, n.tomador, fmtCNPJ(n.cnpj), n.tipo, n.numeroNota,
      (n.descricao||"").replace(/;/g,","), (n.valor!==null?n.valor.toFixed(2).replace(".",","):""), n._st.label
    ]);
    const csv = [head, ...rows].map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(";")).join("\n");
    const blob = new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="falta-contrato_"+new Date().toISOString().slice(0,10)+".csv"; a.click();
  }

  function limparLeva(){ setNotas([]); setLote([]); setFiltro("todas"); }

  return (
    <div>
      <header className="app">
        <div className="inner">
          <div className="mark">GC</div>
          <div>
            <h1>GazetaContratos <span style={{fontSize:11,fontWeight:600,color:"var(--gold-soft)",border:"1px solid var(--gold)",borderRadius:20,padding:"1px 8px",verticalAlign:"middle",marginLeft:6}}>v1.7</span></h1>
            <p>Notas fiscais acima do limite que estão sem contrato</p>
          </div>
        </div>
      </header>

      <div className="wrap">
        <div className="tabs">
          <button className={"tab"+(tab==="conf"?" active":"")} onClick={()=>setTab("conf")}>Conferência</button>
          <button className={"tab"+(tab==="painel"?" active":"")} onClick={()=>setTab("painel")}>Painel</button>
          <button className={"tab"+(tab==="cad"?" active":"")} onClick={()=>setTab("cad")}>
            Cadastro de contratos {registry.length>0 && <span style={{opacity:.7}}>({registry.length})</span>}
          </button>
        </div>

        {tab==="painel" && <Painel notas={enriched} />}

        {tab==="conf" && (
          <Conferencia
            notas={enriched} shown={shown} missing={missing} excecoes={excecoes} foraPol={foraPol} somaMiss={somaMiss}
            lote={lote} limite={limite} setLimite={setLimite}
            filtro={filtro} setFiltro={setFiltro} busy={busy}
            onNotas={onNotas} onContratos={onContratos}
            setValorManual={setValorManual} salvarNoCadastro={salvarNoCadastro} marcarExcecao={marcarExcecao} devolver={devolver}
            runOcr={runOcr} ocrCfg={ocrCfg} ocrRun={ocrRun} readProg={readProg}
            regByCnpj={regByCnpj} regByName={regByName} excByCnpj={excByCnpj} excByName={excByName}
            exportarCSV={exportarCSV} limparLeva={limparLeva}
          />
        )}

        {tab==="cad" && (
          <Cadastro registry={registry} reload={reload} flash={flash} emailCfg={emailCfg} saveEmailCfg={saveEmailCfg} usuarios={usuarios} saveUsuarios={saveUsuarios} ocrCfg={ocrCfg} saveOcrCfg={saveOcrCfg} />
        )}
      </div>

      {picker && <DevolverModal nota={picker} usuarios={usuarios} onSend={enviarDevolucao} onClose={()=>setPicker(null)} />}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

/* ---------------------- Conferência ---------------------- */
function DevolverModal({nota,usuarios,onSend,onClose}){
  const [adhoc,setAdhoc]=useState("");
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>Devolver nota nº {nota.numeroNota||"—"}</h3>
        <p className="msub">{nota.nomeFornecedor} · {fmtBRL(nota.valor)}{nota.tomador?" · "+nota.tomador:""} — escolha o usuário que vai receber:</p>
        {usuarios.length===0 && <p className="footnote" style={{marginTop:0}}>Nenhum usuário cadastrado. Cadastre em "Cadastro → Usuários" ou digite um e-mail abaixo.</p>}
        {usuarios.map((u,i)=>(
          <button className="userbtn" key={i} onClick={()=>onSend(nota,u.email,u.nome)}>
            <span className="un">{u.nome||u.email}</span><span className="ue">{u.email}</span>
          </button>
        ))}
        <div style={{display:"flex",gap:8,marginTop:12}}>
          <input value={adhoc} onChange={e=>setAdhoc(e.target.value)} placeholder="ou digite um e-mail avulso"
            style={{flex:1,border:"1px solid var(--line)",borderRadius:8,padding:"8px 10px",font:"inherit"}} />
          <button className="btn gold" onClick={()=>adhoc.trim()&&onSend(nota,adhoc.trim(),"")}>Devolver</button>
        </div>
        <div style={{textAlign:"right",marginTop:10}}>
          <button className="btn ghost mini" onClick={onClose}>Cancelar</button>
        </div>
      </div>
    </div>
  );
}

function DropZone({title,hint,count,onFiles,accept}){
  const ref=useRef(); const [over,setOver]=useState(false);
  return (
    <div className={"drop"+(over?" over":"")}
      onClick={()=>ref.current.click()}
      onDragOver={e=>{e.preventDefault();setOver(true);}}
      onDragLeave={()=>setOver(false)}
      onDrop={e=>{e.preventDefault();setOver(false);onFiles([...e.dataTransfer.files].filter(f=>/\.pdf$/i.test(f.name)));}}>
      <div className="big">{title}</div>
      <div className="sml">{hint}</div>
      {count>0 && <div className="cnt">{count} arquivo(s) nesta leva</div>}
      <input ref={ref} type="file" accept="application/pdf" multiple style={{display:"none"}}
        onChange={e=>{onFiles([...e.target.files]); e.target.value="";}} />
    </div>
  );
}

function Conferencia(props){
  const {notas,shown,missing,excecoes,foraPol,somaMiss,lote,limite,setLimite,filtro,setFiltro,busy,
    onNotas,onContratos,setValorManual,salvarNoCadastro,marcarExcecao,devolver,runOcr,ocrCfg,ocrRun,readProg,regByCnpj,regByName,excByCnpj,excByName,exportarCSV,limparLeva} = props;

  return (
    <div>
      <div className="card">
        <h2>1. Envie os PDFs desta leva</h2>
        <div className="drops">
          <DropZone title="Notas fiscais (PDF)" hint="Arraste ou clique — pode selecionar várias"
            count={notas.length} onFiles={onNotas} />
          <DropZone title="Contratos desta leva (opcional)" hint="Só se ainda não estiverem no cadastro"
            count={lote.length} onFiles={onContratos} />
        </div>
        <div className="controls">
          <div className="field">
            <label>Limite (R$)</label>
            <input type="number" value={limite} min="0" step="500"
              onChange={e=>setLimite(Number(e.target.value)||0)} style={{width:130}} />
          </div>
          <div style={{flex:1}}></div>
          {notas.length>0 && <button className="btn ghost" onClick={limparLeva}>Limpar leva</button>}
          {busy && (()=>{ const pct = readProg&&readProg.total ? Math.round(readProg.done/readProg.total*100) : 0;
            return (
              <div style={{display:"flex",alignItems:"center",gap:10,minWidth:220}}>
                <div style={{flex:1,height:8,background:"#e7ecf5",borderRadius:6,overflow:"hidden"}}>
                  <div style={{width:pct+"%",height:"100%",background:"var(--teal)",transition:"width .2s"}}></div>
                </div>
                <span style={{color:"var(--teal)",fontWeight:700,fontVariantNumeric:"tabular-nums"}}>
                  Lendo {pct}%{readProg?" ("+readProg.done+"/"+readProg.total+")":""}
                </span>
              </div>
            ); })()}
        </div>
        <div className="footnote">
          O nome do arquivo dá fornecedor, código e nº da nota; o conteúdo dá CNPJ, valor e descrição.
          Uma nota só é apontada como falta de contrato se o fornecedor não estiver nem no cadastro nem anexado nesta leva.
        </div>
      </div>

      {notas.length>0 && (
        <div>
          <div className="summary">
            <div className="stat"><div className="k">Notas na leva</div><div className="v">{notas.length}</div></div>
            <div className="stat"><div className="k">Acima do limite</div>
              <div className="v">{notas.filter(n=>n._st.code!=="low"&&n._st.code!=="ileg").length}</div></div>
            <div className="stat alert"><div className="k">Falta contrato</div><div className="v">{missing.length}</div></div>
            <div className="stat"><div className="k">Exceções</div><div className="v" style={{color:"var(--teal)"}}>{excecoes.length}</div></div>
            <div className="stat" style={foraPol.length?{background:"var(--danger-bg)",borderColor:"var(--danger-line)"}:null}>
              <div className="k">Fora da política (&lt;30d)</div>
              <div className="v" style={{color:foraPol.length?"var(--danger)":"var(--navy)"}}>{foraPol.length}</div></div>
            <div className="stat alert"><div className="k">Soma sem contrato</div><div className="v" style={{fontSize:18}}>{fmtBRL(somaMiss)}</div></div>
          </div>

          <div className="filters">
            <button className={"chip"+(filtro==="todas"?" active":"")} onClick={()=>setFiltro("todas")}>Todas ({notas.length})</button>
            <button className={"chip"+(filtro==="miss"?" active":"")} onClick={()=>setFiltro("miss")}>Só falta contrato ({missing.length})</button>
            <button className={"chip"+(filtro==="exc"?" active":"")} onClick={()=>setFiltro("exc")}>Só exceções ({excecoes.length})</button>
            <button className={"chip"+(filtro==="fora"?" active":"")} onClick={()=>setFiltro("fora")}>Fora da política ({foraPol.length})</button>
            <div style={{flex:1}}></div>
            {ocrRun && <span style={{alignSelf:"center",color:"var(--teal)",fontWeight:600,fontSize:12.5}}>OCR {ocrRun.done}/{ocrRun.total}…</span>}
            {ocrCfg.url && !ocrRun &&
              <button className="btn ghost mini" onClick={()=>{ if(confirm("Reprocessar TODAS as "+notas.length+" notas com OCR (Gemini)? São "+notas.length+" chamadas.")) runOcr(notas); }}>🔍 OCR em todas</button>}
            <button className="btn gold mini" onClick={exportarCSV}>Exportar CSV</button>
          </div>

          <div className="tablewrap">
            <table>
              <thead><tr>
                <th>Emissão</th><th>Fornecedor</th><th>Empresa</th><th>CNPJ</th><th>Tipo</th><th>Nº</th>
                <th>Descrição</th><th className="num">Valor</th><th>Prazo (política)</th><th>Status</th><th></th>
              </tr></thead>
              <tbody>
                {shown.map(n=>{
                  const st=n._st;
                  const cnpj=onlyDigits(n.cnpj);
                  const noCad = !(regByCnpj[cnpj]||regByName[normName(n.nomeFornecedor)]);
                  const temNoLote = lote.some(c=>onlyDigits(c.cnpj)===cnpj || normName(c.nome)===normName(n.nomeFornecedor));
                  return (
                    <tr key={n.id} className={st.code==="miss"?"miss":(st.code==="exc"?"exc":"")}>
                      <td className="num">{n.data||"—"}</td>
                      <td className="forncell"><div className="forn">{n.nomeFornecedor||"—"}</div>
                        {n.codFornecedor && <div className="cod">cód {n.codFornecedor}</div>}</td>
                      <td style={{color:"var(--navy2)",fontSize:12,fontWeight:600,maxWidth:150,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={n.tomador||""}>{n.tomador||"—"}</td>
                      <td className="cnpj">{n.cnpj?fmtCNPJ(n.cnpj):"—"}</td>
                      <td><span className="tipo">{n.tipo}</span></td>
                      <td className="cod">{n.numeroNota||"—"}</td>
                      <td className="desc" title={n.descricao||""}>{n.descricao||"—"}</td>
                      <td className="num">
                        {st.code==="ileg"
                          ? <input className="val-edit" placeholder="digite" defaultValue=""
                              onBlur={e=>e.target.value&&setValorManual(n.id,e.target.value)} />
                          : <span>{fmtBRL(n.valor)}{n.valorManual&&<span title="valor digitado" style={{color:"var(--warn)"}}> ✎</span>}</span>}
                      </td>
                      <td>
                        {(()=>{ const p=politica(n.prazoDias);
                          return (<div style={{display:"flex",flexDirection:"column",gap:2,whiteSpace:"nowrap"}}>
                            {n.vencimento && <span className="cod">venc {n.vencimento}</span>}
                            <span className={"badge "+p.tone}>{p.label}</span>
                          </div>); })()}
                      </td>
                      <td>
                        <span className={"badge "+(st.tone)}>{st.label}</span>
                        {st.code==="ileg" && <div className="footnote" style={{marginTop:4}}>Salve como PDF digital, digite o valor{ocrCfg.url?" ou use 🔍 OCR":""}</div>}
                      </td>
                      <td>
                        <div style={{display:"flex",flexDirection:"column",gap:4}}>
                          {st.code==="miss" && <button className="btn gold mini" onClick={()=>devolver(n)}>✉ Devolver</button>}
                          {st.code==="miss" && <button className="btn link" onClick={()=>marcarExcecao(n)}>Marcar exceção</button>}
                          {st.code==="ok" && temNoLote && noCad &&
                            <button className="btn link" onClick={()=>salvarNoCadastro(n)}>Salvar no cadastro</button>}
                          {ocrCfg.url && n._file && !ocrRun &&
                            <button className="btn ghost mini" onClick={()=>runOcr([n])} title="Reler esta nota com OCR (Gemini)">{n._ocr?"🔍 OCR ✓":"🔍 OCR"}</button>}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {notas.length===0 && (
        <div className="card"><div className="empty">
          <div className="em">📄</div>
          <p>Envie as notas da leva para começar a conferência.</p>
        </div></div>
      )}
    </div>
  );
}

/* ---------------------- Cadastro ---------------------- */
function Cadastro({registry,reload,flash,emailCfg,saveEmailCfg,usuarios,saveUsuarios,ocrCfg,saveOcrCfg}){
  const [cnpj,setCnpj]=useState(""); const [razao,setRazao]=useState("");
  const [vig,setVig]=useState(""); const [obs,setObs]=useState("");
  const [file,setFile]=useState(null); const fileRef=useRef();
  const [exc,setExc]=useState(false); const [motivo,setMotivo]=useState("");
  const [q,setQ]=useState("");
  const [cfg,setCfg]=useState(emailCfg);
  useEffect(()=>{ setCfg(emailCfg); },[emailCfg]);
  const [uNome,setUNome]=useState(""); const [uEmail,setUEmail]=useState("");
  const [ocrUrl,setOcrUrl]=useState(ocrCfg.url||"");
  useEffect(()=>{ setOcrUrl(ocrCfg.url||""); },[ocrCfg]);

  async function add(){
    const d=onlyDigits(cnpj);
    if(!d || d.length<11){ flash("Informe um CNPJ válido"); return; }
    if(!razao.trim()){ flash("Informe a razão social"); return; }
    await dbPut({cnpj:d, razaoSocial:razao.trim(), arquivoNome:file?file.name:"", blob:file||null,
      vigencia:vig, obs:obs, excecao:exc, motivoExcecao:(exc?(motivo.trim()||"Não exige contrato"):""), criadoEm:Date.now()});
    setCnpj("");setRazao("");setVig("");setObs("");setFile(null);setExc(false);setMotivo("");
    if(fileRef.current) fileRef.current.value="";
    await reload(); flash(exc?"Fornecedor cadastrado como exceção":"Fornecedor cadastrado");
  }
  function addUser(){
    const em=uEmail.trim(); if(!em||!/@/.test(em)){ flash("Informe um e-mail válido"); return; }
    if(usuarios.some(u=>u.email.toLowerCase()===em.toLowerCase())){ flash("Usuário já cadastrado"); return; }
    saveUsuarios([...usuarios, {nome:uNome.trim(), email:em}]); setUNome(""); setUEmail(""); flash("Usuário cadastrado");
  }
  function delUser(em){ saveUsuarios(usuarios.filter(u=>u.email!==em)); }
  async function toggleExc(c){
    await dbPut({...c, excecao:!c.excecao, motivoExcecao:(!c.excecao?(c.motivoExcecao||"Não exige contrato"):"")});
    await reload(); flash(!c.excecao?"Marcado como exceção":"Exceção removida");
  }
  async function remove(c){ if(confirm("Remover "+(c.razaoSocial||c.cnpj)+" do cadastro?")){ await dbDel(c.cnpj); await reload(); flash("Removido"); } }
  function baixar(c){ if(!c.blob){flash("Sem arquivo anexado");return;} const u=URL.createObjectURL(c.blob); const a=document.createElement("a"); a.href=u; a.download=c.arquivoNome||"contrato.pdf"; a.click(); }

  const list = registry.filter(r=> !q || normName(r.razaoSocial).includes(normName(q)) || onlyDigits(r.cnpj).includes(onlyDigits(q)) )
    .sort((a,b)=>(a.razaoSocial||"").localeCompare(b.razaoSocial||""));

  return (
    <div>
      <div className="card">
        <h2>Novo fornecedor <span className="hint">contrato ou exceção — indexado por CNPJ + razão social</span></h2>
        <div className="controls">
          <div className="field"><label>CNPJ</label>
            <input value={cnpj} onChange={e=>setCnpj(e.target.value)} placeholder="00.000.000/0000-00" style={{width:180}} /></div>
          <div className="field" style={{flex:1,minWidth:220}}><label>Razão social</label>
            <input value={razao} onChange={e=>setRazao(e.target.value)} placeholder="Nome do fornecedor" style={{width:"100%"}} /></div>
          <div className="field"><label>Vigência (opcional)</label>
            <input value={vig} onChange={e=>setVig(e.target.value)} placeholder="ex.: até 12/2026" style={{width:150}} /></div>
        </div>
        <label className="excbox" style={{display:"flex",alignItems:"center",gap:8,margin:"6px 0 2px",cursor:"pointer",fontWeight:600,color:"var(--teal)"}}>
          <input type="checkbox" checked={exc} onChange={e=>setExc(e.target.checked)} />
          Marcar como exceção (não exige contrato)
        </label>
        <div className="controls">
          {exc
            ? <div className="field" style={{flex:1,minWidth:220}}><label>Motivo da exceção</label>
                <input value={motivo} onChange={e=>setMotivo(e.target.value)} placeholder="ex.: locação recorrente, órgão público, reembolso" style={{width:"100%"}} /></div>
            : <div className="field" style={{flex:1,minWidth:220}}><label>Observação (opcional)</label>
                <input value={obs} onChange={e=>setObs(e.target.value)} style={{width:"100%"}} /></div>}
          {!exc &&
            <div className="field"><label>PDF do contrato (opcional)</label>
              <input ref={fileRef} type="file" accept="application/pdf" onChange={e=>setFile(e.target.files[0]||null)} /></div>}
          <button className="btn primary" onClick={add}>{exc?"Cadastrar exceção":"Cadastrar contrato"}</button>
        </div>
      </div>

      <div className="card">
        <h2>Fornecedores cadastrados <span className="hint">{registry.length} no total · {registry.filter(r=>r.excecao).length} exceção(ões)</span></h2>
        {registry.length>0 &&
          <div className="field" style={{marginBottom:10}}>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar por nome ou CNPJ" style={{width:"100%",maxWidth:320}} />
          </div>}
        {list.length===0
          ? <div className="empty"><p>Nenhum contrato cadastrado ainda. Cadastre acima, ou salve direto da conferência.</p></div>
          : list.map(c=>(
            <div className="reg-row" key={c.cnpj}>
              <div className="reg-main">
                <div className="rn">{c.razaoSocial||"(sem nome)"}
                  {c.excecao && <span className="badge exc" style={{marginLeft:8}}>Exceção</span>}</div>
                <div className="rc">{fmtCNPJ(c.cnpj)}
                  {c.excecao ? (c.motivoExcecao?" · "+c.motivoExcecao:"") : (c.vigencia?" · "+c.vigencia:"")}
                  {!c.excecao && c.obs?" · "+c.obs:""}</div>
              </div>
              <div className="reg-file">
                {c.excecao
                  ? <span style={{color:"var(--teal)",fontWeight:600}}>não exige contrato</span>
                  : (c.arquivoNome
                      ? <button className="btn link" onClick={()=>baixar(c)}>{c.arquivoNome}</button>
                      : <span style={{color:"var(--muted)"}}>sem PDF</span>)}
              </div>
              <button className="btn ghost mini" onClick={()=>toggleExc(c)}>{c.excecao?"Tornar contrato":"Tornar exceção"}</button>
              <button className="btn danger mini" onClick={()=>remove(c)}>Remover</button>
            </div>
          ))}
      </div>

      <div className="card">
        <h2>OCR (Gemini) <span className="hint">reforço automático nas notas ilegíveis ou sem valor; também pelo botão 🔍 OCR</span></h2>
        <div className="controls">
          <div className="field" style={{flex:1,minWidth:280}}><label>URL do proxy Gemini</label>
            <input value={ocrUrl} onChange={e=>setOcrUrl(e.target.value)} placeholder="https://seu-proxy.workers.dev/...:generateContent" style={{width:"100%"}} /></div>
          <button className="btn primary" onClick={()=>saveOcrCfg({url:ocrUrl.trim()})}>Salvar</button>
          {ocrCfg.url && <button className="btn ghost mini" onClick={()=>saveOcrCfg({url:""})}>Desligar</button>}
        </div>
        <div className="footnote">
          Use o mesmo proxy do Checador. O app envia o PDF (<code>inlineData</code>, <code>application/pdf</code>) no corpo padrão do Gemini
          (<code>{"{contents, generationConfig}"}</code>) e espera a resposta padrão <code>candidates[0].content.parts[].text</code> em JSON.
          Sem URL, o sistema segue só na leitura de texto (grátis).
        </div>
      </div>

      <div className="card">
        <h2>Usuários (para devolução) <span className="hint">{usuarios.length} cadastrado(s) — aparecem na lista ao clicar ✉ Devolver</span></h2>
        <div className="controls">
          <div className="field"><label>Nome</label>
            <input value={uNome} onChange={e=>setUNome(e.target.value)} placeholder="ex.: Maria — Compras" style={{width:220}} /></div>
          <div className="field" style={{flex:1,minWidth:240}}><label>E-mail interno</label>
            <input value={uEmail} onChange={e=>setUEmail(e.target.value)} placeholder="usuario@redegazeta.com.br" style={{width:"100%"}}
              onKeyDown={e=>e.key==="Enter"&&addUser()} /></div>
          <button className="btn primary" onClick={addUser}>Adicionar</button>
        </div>
        {usuarios.length>0 &&
          <div style={{marginTop:10}}>
            {usuarios.map((u,i)=>(
              <div className="reg-row" key={i}>
                <div className="reg-main"><div className="rn">{u.nome||"(sem nome)"}</div><div className="rc">✉ {u.email}</div></div>
                <button className="btn danger mini" onClick={()=>delUser(u.email)}>Remover</button>
              </div>
            ))}
          </div>}
      </div>

      <div className="card">
        <h2>Texto fixo da devolução <span className="hint">usado no botão ✉ Devolver — placeholders: {"{numero} {valor} {fornecedor} {empresa} {cnpj} {remetente}"}</span></h2>
        <div className="controls">
          <div className="field"><label>Seu nome / assinatura (remetente)</label>
            <input value={cfg.remetente||""} onChange={e=>setCfg({...cfg,remetente:e.target.value})} placeholder="ex.: Fábio — Controladoria" style={{width:260}} /></div>
          <div className="field" style={{flex:1,minWidth:260}}><label>Assunto</label>
            <input value={cfg.assunto||""} onChange={e=>setCfg({...cfg,assunto:e.target.value})} style={{width:"100%"}} /></div>
        </div>
        <div className="field" style={{marginTop:4}}><label>Corpo do e-mail</label>
          <textarea value={cfg.corpo||""} onChange={e=>setCfg({...cfg,corpo:e.target.value})} rows={7} style={{width:"100%",resize:"vertical"}} /></div>
        <div style={{marginTop:8,display:"flex",gap:8,alignItems:"center"}}>
          <button className="btn primary" onClick={()=>saveEmailCfg(cfg)}>Salvar texto</button>
          <button className="btn ghost mini" onClick={()=>setCfg(EMAIL_PADRAO)}>Restaurar padrão</button>
          <span className="footnote" style={{margin:0}}>A NF não vai anexada automática — ela é baixada pra você arrastar no e-mail.</span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
/* PWA: registra o service worker (silencioso em file://) */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
